name: ci
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned: gas evidence (refunds kept per draw, O1) differs between Foundry versions.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: forge build --sizes
      - run: npm run typecheck
      - run: npx vitest run
      # Fork scenario against the real FWA pool and Shapes (public RPC, pinned block).
      - run: forge test --match-path test/Fork.t.sol
