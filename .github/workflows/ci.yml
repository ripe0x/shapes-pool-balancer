name: ci
on: [pull_request, push]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether full checks are needed
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let files;
            let limit;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: context.payload.pull_request.number, per_page: 100
              });
              limit = 3000;
            } else {
              const before = context.payload.before;
              const base = !before || /^0+$/.test(before)
                ? context.payload.repository.default_branch : before;
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${base}...${context.sha}`
              });
              files = data.files ?? [];
              limit = 300;
            }
            // GitHub caps PR file lists at 3,000 and commit comparisons at 300.
            // Docs-only shortcut: every changed file (and rename source) must be a .md
            // file that is not a protected requirement/decision document.
            const protectedMd = new Set([
              'OWNER-REQUIREMENTS.md', 'docs/CONFIG-INVENTORY.md', 'docs/DECISIONS.md'
            ]);
            const skippable = (f) => !!f && f.endsWith('.md') && !protectedMd.has(f) &&
              !f.startsWith('test/') && !f.startsWith('script/') && !f.startsWith('scripts/') &&
              !f.startsWith('deployments/') && !f.startsWith('.github/');
            const full = files.length === 0 || files.length >= limit ||
              files.some(({ filename, previous_filename }) =>
                !skippable(filename) || (previous_filename && !skippable(previous_filename)));
            core.setOutput('full', String(full));
      - uses: actions/checkout@v4
        if: steps.changes.outputs.full == 'true'
        with:
          submodules: recursive
      # Pinned: gas evidence (refunds kept per draw, O1) differs between Foundry versions.
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.changes.outputs.full == 'true'
        with:
          version: v1.8.1
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.full == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.full == 'true'
        run: npm ci
      - if: steps.changes.outputs.full == 'true'
        run: forge build --sizes
      - if: steps.changes.outputs.full == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.full == 'true'
        run: npm run test:ts
      - if: steps.changes.outputs.full == 'true'
        run: npm run build:app
      # Fork scenario against the real FWA pool and Shapes (public RPC, pinned block).
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/Fork.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/CommunityConfigAcceptance.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/Settings.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/PolicyLifecycle.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/PolicyPreview.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/PolicyModelParity.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/Reserve.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/ReserveCapital.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/KeeperPay.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/KeeperAdversarial.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/ProtectedRevenueAtomic.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/ProductLimits.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/MintFeeChange.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/CuratedAdmission.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/OptionalCurated.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/Balancer.t.sol
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-contract ParityFixture
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-contract GasBench --isolate
      # Whole suite exceeds the default 2^30 test gas limit.
      - if: steps.changes.outputs.full == 'true'
        run: forge test --match-path test/scenario/FlowBreakdown.t.sol --gas-limit 100000000000 --isolate
