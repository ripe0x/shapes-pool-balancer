[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./test/fixtures" }, { access = "read", path = "./out" }]

[profile.default.lint]
lint_on_build = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64

[rpc_endpoints]
mainnet = "https://mainnet.gateway.tenderly.co"
